<h1>UnityBuilder</h1>
<p>UnityBuilder 는 팀 안에서만 쓰는 Unity 빌드 도구입니다. Mac 에서 Unity 프로젝트를 빌드하고,
만들어진 안드로이드 APK 를 팀원이 폰에서 받을 수 있게 합니다.</p>
<ul>
  <li>텔레그램 봇 버튼으로 빌드를 시작하고 결과 링크를 받습니다.</li>
  <li>빌드한 APK 를 빌드한 사람 본인의 Google 드라이브에 올리고, 정해 둔 팀원 계정에만 공유합니다.</li>
</ul>
<p>일반 사용자를 위한 서비스가 아니며, 회원 가입이나 판매가 없습니다.</p>
